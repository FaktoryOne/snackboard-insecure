name: security-probes

# Runs the attack-probe suite on every pull request. The build goes red the
# moment an attack that used to be blocked starts working again.
#
# Copy this file into your own repository. The only things you normally need
# to change are the Node version and how your app is started.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  probes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The secret-history probe reads the full history, not just the tip.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          # Must satisfy the `engines` range in package.json. `.npmrc` turns
          # that range into a hard requirement, so a Node outside it fails
          # `npm ci` outright rather than failing later for an unclear reason.
          node-version: 22
          cache: npm

      - run: npm ci

      # Starts the API, runs every probe against it, shuts the API down.
      - run: npm run test:security
